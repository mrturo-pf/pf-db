name: CI / Deploy migrations to Neon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Migration concurrency is scoped to the migration job below. The workflow
# itself must not serialize documentation-only runs ahead of code migrations.

permissions:
  contents: read

jobs:
  changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "push" ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            files=$(git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}")
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs=$(while IFS= read -r file; do
            case "${file}" in
              *.md|*.mdx|*.rst|*.adoc|docs/*.txt|documentation/*.txt) ;;
              *) printf '%s\n' "${file}" ;;
            esac
          done <<< "${files}")
          if [ -n "${files}" ] && [ -z "${non_docs}" ]; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; else echo "docs_only=false" >> "$GITHUB_OUTPUT"; fi

  # check: validate migrations against a fresh PostgreSQL instance and run lint
  # ------------------------------------------------------------------
  check:
    name: Database migration validation
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pf_db
          POSTGRES_USER: pf_db
          POSTGRES_PASSWORD: pf_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pf_db -d pf_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://pf_db:pf_db@localhost:5432/pf_db

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7.0.0
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Setup Python with dependencies
        uses: ./.pf-common/.github/actions/setup-python-deps
        with:
          python-version: '3.14'
          cache-dependency-path: pyproject.toml
          working-directory: '.'
          install-extras: '[dev]'

      - name: Run migrations against fresh PostgreSQL
        run: alembic upgrade head

      - name: Verify database is at migration head
        run: make migration-check

      - name: Lint
        run: make check

  # deploy: apply migrations after a successful merge to protected main
  # The merge is the release approval; this job never runs on pull requests.
  # ------------------------------------------------------------------
  migrate:
    name: Apply migrations & seed database
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pf-db-production
      cancel-in-progress: false
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7.0.0
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Setup Python with dependencies
        uses: ./.pf-common/.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          cache-dependency-path: pyproject.toml
          working-directory: '.'
          install-extras: '[dev]'

      - name: Validate migration identity
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  role = await connection.fetchval("SELECT current_user")
                  owned = await connection.fetchval(
                      """
                      SELECT count(*)
                      FROM pg_class
                      WHERE relname IN ('PAY_PENS_INST', 'INC_PENS_INST')
                        AND relowner = (SELECT oid FROM pg_roles WHERE rolname = current_user)
                      """
                  )
                  print(f"Migration role: {role}; owned target tables: {owned}")
                  if not owned:
                      raise SystemExit("Migration identity does not own the target schema objects")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if ! alembic upgrade head 2>"$error_file"; then
            error_summary="$(tr '\n' ' ' <"$error_file" | sed -E 's#postgres(ql\+asyncpg)?://[^ ]+#postgresql://[REDACTED]#g' | tr -s ' ' | cut -c1-1800)"
            echo "::error title=Production migration failure::${error_summary}"
            cat "$error_file"
            exit 1
          fi

      - name: Verify DB is at migration head
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: make migration-check

      - name: Install psql client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Seed base data
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          # psql (libpq) needs postgresql:// and sslmode=, not ssl=
          PSQL_URL="${DATABASE_URL/postgresql+asyncpg/postgresql}"
          PSQL_URL="${PSQL_URL/ssl=require/sslmode=require}"
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 -f db/02_seed_base.sql

      - name: Seed real data (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          PSQL_URL="${DATABASE_URL/postgresql+asyncpg/postgresql}"
          PSQL_URL="${PSQL_URL/ssl=require/sslmode=require}"
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 -f db/04_seed_real.sql

  # ------------------------------------------------------------------
  # notify-failure: email alert when any job fails on push to main.
  # Uses explicit result checks instead of failure() to avoid false
  # positives — a skipped migrate job (e.g. on a PR) must not trigger
  # the alert.
  # Requires MAIL_SERVER / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD /
  # MAIL_FROM / MAIL_TO secrets to be set in this repo's settings.
  # ------------------------------------------------------------------
  notify-failure:
    name: Notify — Failure
    runs-on: ubuntu-latest
    needs: [check, migrate, changes]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.result == 'failure' || needs.check.result == 'failure' ||
       needs.migrate.result == 'failure')

    steps:
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7.0.0
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Send failure email
        uses: ./.pf-common/.github/actions/send-email
        with:
          mail_server: ${{ secrets.MAIL_SERVER }}
          mail_port: ${{ secrets.MAIL_PORT }}
          mail_username: ${{ secrets.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ secrets.MAIL_TO }}
          subject: "[FAILED] pf-db pipeline — ${{ github.ref_name }}"
          body: |
            One or more jobs failed in the pf-db CI/CD pipeline.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Author:  ${{ github.actor }}

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ------------------------------------------------------------------
  # notify-success: email confirmation after a successful full deploy
  # ------------------------------------------------------------------
  notify-success:
    name: Notify — Success
    runs-on: ubuntu-latest
    needs: [migrate, changes]
    if: |
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.migrate.result == 'success'

    steps:
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7.0.0
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Send success email
        uses: ./.pf-common/.github/actions/send-email
        with:
          mail_server: ${{ secrets.MAIL_SERVER }}
          mail_port: ${{ secrets.MAIL_PORT }}
          mail_username: ${{ secrets.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ secrets.MAIL_TO }}
          subject: "[SUCCESS] pf-db migrations deployed — ${{ github.ref_name }}"
          body: |
            pf-db migrations deployed successfully to Neon.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Author:  ${{ github.actor }}

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
